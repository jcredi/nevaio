name: Publish latest GFSC snapshot

on:
  schedule:
    # Daily HR-WSI arrivals normally finish before 03:00 UTC.
    - cron: "35 4 * * *"
  workflow_dispatch:
    inputs:
      as_of_date:
        description: "Catalogue cutoff (YYYY-MM-DD); blank uses the runner's current date"
        required: false
        type: string
      tiles:
        description: "Optional space-separated MVP MGRS tiles; blank uses the full area"
        required: false
        type: string
      max_missing_tiles:
        description: "Publish even if this many tiles have no product in the window (default 0)"
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: publish-latest-gfsc-preview
  cancel-in-progress: false

jobs:
  render:
    # Also restrict the production-r2 environment to main in GitHub settings.
    if: github.ref == 'refs/heads/main'
    name: Render without publication credentials
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    steps:
      - name: Check out trusted source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Install locked render dependencies
        run: |
          python -m pip install --require-hashes --only-binary=:all: -r pipeline/requirements.txt
      - name: Run pipeline and isolation tests
        run: python -m unittest discover -s pipeline/tests
      - name: Render snapshot
        env:
          AS_OF_DATE: ${{ inputs.as_of_date }}
          REQUESTED_TILES: ${{ inputs.tiles }}
          MAX_MISSING_TILES: ${{ inputs.max_missing_tiles }}
        run: |
          args=(
            --raw-dir "${RUNNER_TEMP}/gfsc-raw"
            --work-dir "${RUNNER_TEMP}/gfsc-work"
            --output-dir "${RUNNER_TEMP}/gfsc-output"
          )
          if [[ -n "${AS_OF_DATE}" ]]; then args+=(--as-of "${AS_OF_DATE}"); fi
          if [[ -n "${REQUESTED_TILES}" ]]; then
            read -r -a tiles <<< "${REQUESTED_TILES}"
            args+=(--tiles "${tiles[@]}")
          fi
          if [[ -n "${MAX_MISSING_TILES}" ]]; then
            args+=(--max-missing-tiles "${MAX_MISSING_TILES}")
          fi
          python -m pipeline.preview "${args[@]}"
      - name: Transfer only rendered runs
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: gfsc-render-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/gfsc-output/runs/
          if-no-files-found: error
          retention-days: 1
          compression-level: 0
          include-hidden-files: false

  publish:
    needs: render
    if: github.ref == 'refs/heads/main'
    name: Validate and publish on a fresh runner
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    environment: production-r2
    steps:
      - name: Check out trusted source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Install locked minimal publisher dependencies
        # Deliberately no shared pip cache and no raster/image libraries.
        run: |
          python -m pip install --require-hashes --only-binary=:all: -r pipeline/requirements-publish.txt
      - name: Download this run's data outside the source checkout
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: gfsc-render-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/rendered-runs
      - name: Validate untrusted artifact without secrets
        env:
          AS_OF_DATE: ${{ inputs.as_of_date }}
          REQUESTED_TILES: ${{ inputs.tiles }}
          MAX_MISSING_TILES: ${{ inputs.max_missing_tiles }}
        run: |
          args=(--runs-dir "${RUNNER_TEMP}/rendered-runs" --check-only)
          if [[ -n "${AS_OF_DATE}" ]]; then args+=(--as-of "${AS_OF_DATE}"); fi
          if [[ -n "${REQUESTED_TILES}" ]]; then
            read -r -a tiles <<< "${REQUESTED_TILES}"
            args+=(--tiles "${tiles[@]}")
          fi
          if [[ -n "${MAX_MISSING_TILES}" ]]; then
            args+=(--max-missing-tiles "${MAX_MISSING_TILES}")
          fi
          python -m pipeline.publish "${args[@]}"
      - name: Publish validated run
        env:
          R2_ACCOUNT_ID: ${{ vars.R2_ACCOUNT_ID }}
          R2_BUCKET: ${{ vars.R2_BUCKET }}
          R2_PUBLIC_BASE_URL: ${{ vars.R2_PUBLIC_BASE_URL }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AS_OF_DATE: ${{ inputs.as_of_date }}
          REQUESTED_TILES: ${{ inputs.tiles }}
          MAX_MISSING_TILES: ${{ inputs.max_missing_tiles }}
        run: |
          args=(
            --runs-dir "${RUNNER_TEMP}/rendered-runs"
            --keep-runs 7
            --receipt "${RUNNER_TEMP}/publication-receipt.json"
          )
          if [[ -n "${AS_OF_DATE}" ]]; then args+=(--as-of "${AS_OF_DATE}"); fi
          if [[ -n "${REQUESTED_TILES}" ]]; then
            read -r -a tiles <<< "${REQUESTED_TILES}"
            args+=(--tiles "${tiles[@]}")
          fi
          if [[ -n "${MAX_MISSING_TILES}" ]]; then
            args+=(--max-missing-tiles "${MAX_MISSING_TILES}")
          fi
          python -m pipeline.publish "${args[@]}"
      - name: Verify public pointer matches this publication
        env:
          R2_PUBLIC_BASE_URL: ${{ vars.R2_PUBLIC_BASE_URL }}
        run: |
          curl --fail --show-error --retry 5 --max-time 60 \
            --output "${RUNNER_TEMP}/published-latest.json" \
            "${R2_PUBLIC_BASE_URL%/}/latest.json"
          python - <<'PY'
          import json, os
          from pathlib import Path
          temp = Path(os.environ["RUNNER_TEMP"])
          actual = json.loads((temp / "published-latest.json").read_text())
          expected = json.loads((temp / "publication-receipt.json").read_text())
          if actual != expected:
              raise SystemExit("Public pointer does not match this publication")
          print(f"Verified run {expected['runId']}")
          PY
      - name: Preserve publication metadata
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: latest-gfsc-preview-metadata
          path: |
            ${{ runner.temp }}/published-latest.json
            ${{ runner.temp }}/publication-receipt.json
          if-no-files-found: error
          retention-days: 7
